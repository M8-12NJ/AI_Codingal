<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Superhero Card</title>

    <style>
        /* Typography - background, font and text colour */
        body {
            background-color: rgb(192, 29, 88);
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Typography and Text Shadow - superhero name */
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        /* Typography and Text Transform - tagline */
        .tagline {
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        /* Text Transform and Text Decoration - headings */
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        /* Typography - superpowers */
        .power {
            font-weight: bold;
            color: lightgreen;
        }

        /* Text Decoration - weaknesses */
        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        /* Transform - rotate the superhero badge */
        .badge {
            display: inline-block;
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        /* Typography - footer text */
        .made-by {
            color: coral;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1 class="hero-name">Thunder Kid</h1>

    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>

    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>

    <p class="weakness">Maths homework</p>
    <p class="weakness">Broccoli</p>

    <p class="badge">Top Hero</p>

    <p class="made-by">Created by Mahima</p>

</body>

</html>
